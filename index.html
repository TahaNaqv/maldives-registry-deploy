<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maldives Blue Carbon Registry</title>
<meta name="description" content="Working prototype of a national blue carbon registry and tokenization platform for the Maldives, by Ideofuzion.">
<meta name="robots" content="noindex">
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed navy sidebar, scrolling main column; cards only for discrete objects (KPIs, listings, drawers). */
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --surface-2:#EAF0F4; --line:#D9E2E8; --fg:#14213D; --muted:#5B6B7F;
  --navy:#0B2545; --navy-fg:#CFE6EC; --teal:#1C7293; --sea:#00A896; --orange:#F77F00; --orange-fg:#FFFFFF;
  --good-bg:#E3F4F0; --good-fg:#00704F; --warn-bg:#FFF1DC; --warn-fg:#B25B00; --info-bg:#E6F0F7; --info-fg:#1C5D8A; --purple-bg:#EEE8FB; --purple-fg:#5B3FA6;
  --display:'Manrope',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0E1626; --surface:#162236; --surface-2:#1E2D45; --line:#2B3C55; --fg:#E8EEF4; --muted:#9FB0C3; --navy:#081A33; --navy-fg:#B9D3DD; --teal:#5FB0D1; --sea:#2EC4AE; --good-bg:#153B33; --good-fg:#7FE0C3; --warn-bg:#3F2A10; --warn-fg:#FFC27A; --info-bg:#17304A; --info-fg:#8FC3F0; --purple-bg:#2B2347; --purple-fg:#C7B6F5; color-scheme:dark } }
:root[data-theme="dark"]{ --bg:#0E1626; --surface:#162236; --surface-2:#1E2D45; --line:#2B3C55; --fg:#E8EEF4; --muted:#9FB0C3; --navy:#081A33; --navy-fg:#B9D3DD; --teal:#5FB0D1; --sea:#2EC4AE; --good-bg:#153B33; --good-fg:#7FE0C3; --warn-bg:#3F2A10; --warn-fg:#FFC27A; --info-bg:#17304A; --info-fg:#8FC3F0; --purple-bg:#2B2347; --purple-fg:#C7B6F5; color-scheme:dark }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.app{display:flex;min-height:100%}
.side{width:240px;flex-shrink:0;background:var(--navy);color:var(--navy-fg);display:flex;flex-direction:column;padding:22px 14px;gap:22px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:28px;height:42px;object-fit:contain}
.brand b{display:block;font-family:var(--display);font-weight:800;font-size:13px;color:#fff;line-height:1.2}
.brand small{font-size:11px;color:#8FB8C9}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:8px;color:var(--navy-fg);text-decoration:none;font-size:13.5px;font-weight:500}
.nav a svg{width:18px;height:18px;flex-shrink:0}
.nav a.active{background:rgba(255,255,255,.13);color:#fff;font-weight:600}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.side .env{margin-top:auto;padding:12px;border-radius:10px;background:rgba(255,255,255,.07);font-size:12px;color:#9FC5D8}
.side .env b{display:block;color:#fff;font-size:13px;margin:4px 0}
.side .env button{margin-top:8px;width:100%;padding:7px;border-radius:6px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;font-size:12px}
main{flex-grow:1;min-width:0;padding-block:22px;padding-inline:28px;display:flex;flex-direction:column;gap:18px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{margin:0;font-family:var(--display);font-size:22px;font-weight:800;color:var(--fg)}
.top .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.top .grow{flex-grow:1;min-width:0}
.role{display:flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px}
.role select{border:0;background:transparent;font-weight:600;padding:4px 2px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.span2{grid-column:span 2}
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.span2{grid-column:span 1}}
@media (max-width:760px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center}.nav{flex-direction:row;flex-wrap:wrap}.nav a span{display:none}.side .env{display:none}.g4,.g2{grid-template-columns:1fr}main{padding-inline:16px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:500}
.kpi .v{font-family:var(--display);font-size:26px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--teal)}
h2{margin:0 0 10px;font-family:var(--display);font-size:15px;font-weight:700}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good-fg)} .p-warn{background:var(--warn-bg);color:var(--warn-fg)} .p-info{background:var(--info-bg);color:var(--info-fg)} .p-purple{background:var(--purple-bg);color:var(--purple-fg)} .p-muted{background:var(--surface-2);color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 15px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:var(--orange-fg)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.input,select.input{height:38px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
label.lbl{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.sr{position:absolute;left:-9999px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 10px;background:var(--surface-2)}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
tr.sel td{background:var(--info-bg)}
tr.click{cursor:pointer}
.mono{font-family:var(--mono);font-size:12px}
.tabular{font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sea);border-radius:3px}
.alert{display:flex;gap:10px;padding:11px 12px;border-radius:10px;font-size:12.5px}
.alert i{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.feed div{padding:8px 0;border-top:1px solid var(--line);font-size:12.5px;display:flex;gap:10px}
.feed span.t{color:var(--muted);width:48px;flex-shrink:0}
.steps{display:flex;gap:0;align-items:flex-start}
.steps .s{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.steps .s .h{display:flex;align-items:center}
.steps .s .n{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;background:var(--surface-2);color:var(--muted);flex-shrink:0}
.steps .s .ln{flex:1;height:2px;background:var(--line)}
.steps .s.done .n,.steps .s.done .ln{background:var(--sea);color:#fff}
.steps .s.cur .n{background:var(--orange);color:#fff}
.steps .s b{font-size:12px}.steps .s small{font-size:11px;color:var(--muted)}
.listing{display:flex;gap:16px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%}
.listing.sel{border:2px solid var(--orange)}
.listing .sw{width:120px;height:90px;border-radius:10px;flex-shrink:0;display:flex;align-items:flex-end;padding:8px}
.listing .sw span{background:rgba(255,255,255,.92);color:#0B2545;font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
.listing .px{font-family:var(--display);font-size:20px;font-weight:800;white-space:nowrap}
.qty{display:flex;gap:8px;align-items:center}.qty button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px}.qty div{flex:1;height:40px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px;font-weight:800}
.tog{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%;text-align:left}
.tog .k{width:38px;height:22px;border-radius:11px;padding:2px;background:#C9D3DB;display:flex;flex-shrink:0}.tog .k i{width:18px;height:18px;border-radius:50%;background:#fff}.tog.on .k{background:var(--sea);justify-content:flex-end}
.cert{background:var(--surface);border-radius:16px;overflow:hidden;display:flex;border:1px solid var(--line)}
.cert .left{width:300px;flex-shrink:0;background:#1C7293;color:#fff;padding:30px 26px;display:flex;flex-direction:column;gap:18px}
.cert .left .big{font-family:var(--display);font-size:50px;font-weight:800;line-height:1}
.cert .right{flex:1;padding:30px 32px;display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:760px){.cert{flex-direction:column}.cert .left{width:100%}}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;padding:12px 16px;border-radius:10px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:360px;z-index:50}
.modal-bg{position:fixed;inset:0;background:rgba(5,15,30,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:22px;width:460px;max-width:100%;display:flex;flex-direction:column;gap:14px}
.phone{width:380px;max-width:100%;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px}
.chart{width:100%;height:190px;display:block}
.muted{color:var(--muted)}.small{font-size:12px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13px}.kv .k{color:var(--muted)}
canvas{max-width:100%}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .25s ease}}@keyframes up{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
</style>

<div class="app" id="app"></div>
<div id="overlay"></div>

let S;
try { const raw = localStorage.getItem('bcr-demo-v2'); S = raw ? JSON.parse(raw) : seed(); } catch(e){ S = seed(); }
function save(){ try{ localStorage.setItem('bcr-demo-v2', JSON.stringify(S)); }catch(e){} }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }
function log(text){ S.events.push({ts:now(),text}); S.block += 1; }
function project(id){ return S.projects.find(p=>p.id===id); }
function available(pid){ return S.batches.filter(b=>b.project===pid&&b.status==='issued').reduce((a,b)=>a+b.qty,0); }
function nextSerial(pid){ const p=project(pid); const n=S.batches.filter(b=>b.project===pid).length+1; return `${p.code}-${String(p.vintage).slice(2)}-${String(n).padStart(2,'0')}-000001`; }
function takeFromIssued(pid, qty){ // consume issued credits; returns ok
  let need=qty; for(const b of S.batches){ if(b.project===pid&&b.status==='issued'&&need>0){ const take=Math.min(b.qty,need); b.qty=Math.round((b.qty-take)*10)/10; need-=take; } }
  S.batches = S.batches.filter(b=>b.qty>0); return need<=0.0001;
}
function set(view){ S.view=view; location.hash=view; render(); }
function confirmBox(title, body, okLabel, onOk){
  const o=document.getElementById('overlay');
  o.innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-label="${title}"><h2 style="margin:0">${title}</h2><div class="small">${body}</div><div class="row" style="justify-content:flex-end"><button class="btn" id="mCancel">Cancel</button><button class="btn primary" id="mOk">${okLabel}</button></div></div></div>`;
  o.querySelector('#mCancel').onclick=()=>o.innerHTML='';
  o.querySelector('#mOk').onclick=()=>{o.innerHTML=''; onOk();};
}

/* ---------- actions ---------- */
function issue(pid, qty){
  const p=project(pid); const buf=Math.round(qty*p.buffer); const net=qty-buf;
  S.batches.push({id:'b'+hash(),serial:nextSerial(pid),project:pid,qty:buf,status:'buffer',holder:'Buffer pool (locked)',vintage:p.vintage,tx:tx(),ts:now()});
  S.batches.push({id:'b'+hash(),serial:nextSerial(pid),project:pid,qty:net,status:'issued',holder:'MoTE issuance wallet',vintage:p.vintage,tx:tx(),ts:now()});
  S.monthly[S.monthly.length-1][0]+=net;
  log(`<b>Issued</b> ${fmt(net)} t · ${p.code}, ${fmt(buf)} t to buffer, validator SGS`);
  toast(`${fmt(net)} tCO2e issued for ${p.code}. ${fmt(buf)} t held in buffer.`); save(); render();
}
function buy(){
  const m=S.market, p=project(m.listing), qty=m.qty;
  if(available(p.id)<qty){ toast('Not enough issued credits in this listing.'); return; }
  takeFromIssued(p.id, qty);
  const sub=qty*p.price, fee=Math.round(sub*0.02);
  const id='b'+hash();
  const b={id,serial:nextSerial(p.id),project:p.id,qty,status:m.retire?'retired':'transferred',holder:m.retire?'[Resort name], retired':'Resort wallet 0x7a3c',vintage:p.vintage,tx:tx(),ts:now()};
  S.batches.push(b);
  log(`<b>Transferred</b> ${fmt(qty)} t · ${p.code} to resort wallet 0x7a3c, USD ${fmt(sub+fee)}`);
  log(`<b>Benefit share</b> paid · ${p.developer} USD ${fmt(sub*0.35)}, community fund USD ${fmt(sub*0.15)}, MoFP USD ${fmt(sub*0.40)}`);
  S.monthly[S.monthly.length-1][1]+= m.retire?qty:0;
  if(m.retire){ const c={id:'c'+hash().slice(0,6),batch:id,qty,project:p.id,for:'[Resort name], 2026 operations',by:'[Resort name]',ts:now(),tx:b.tx,block:S.block}; b.cert=c.id; S.certs.push(c); log(`<b>Retired</b> ${fmt(qty)} t · certificate ${c.id} issued`); S.cert=c.id; save(); set('certs'); toast(`Purchased and retired ${fmt(qty)} tCO2e. Certificate ${c.id} issued.`); }
  else { save(); set('ledger'); toast(`Purchased ${fmt(qty)} tCO2e. Tokens are in your wallet.`); }
}
function retireBatch(id){
  const b=S.batches.find(x=>x.id===id); const p=project(b.project);
  b.status='retired'; b.tx=tx(); b.ts=now();
  const c={id:'c'+hash().slice(0,6),batch:id,qty:b.qty,project:p.id,for:b.holder,by:b.holder,ts:now(),tx:b.tx,block:S.block}; b.cert=c.id; S.certs.push(c);
  S.monthly[S.monthly.length-1][1]+=b.qty;
  log(`<b>Retired</b> ${fmt(b.qty)} t · ${p.code}, certificate ${c.id}`); S.cert=c.id; save(); set('certs'); toast(`Retired ${fmt(b.qty)} tCO2e. Certificate issued.`);
}
function advanceLoa(id){
  const l=S.loas.find(x=>x.id===id); const p=project(l.project);
  if(l.step>=6) return;
  l.step+=1;
  if(l.step===5){ if(available(l.project)>=l.qty){ takeFromIssued(l.project,l.qty); S.batches.push({id:'b'+hash(),serial:nextSerial(l.project),project:l.project,qty:l.qty,status:'authorised',holder:'Article 6 escrow, MoFP',vintage:p.vintage,tx:tx(),ts:now()}); log(`<b>Authorised</b> ${fmt(l.qty)} t tagged and escrowed under ${l.id}`);} else { log(`<b>Authorisation</b> ${l.id}: insufficient issued credits to escrow, escrow pending`);} }
  if(l.step===6){ l.ca=l.qty; const esc=S.batches.find(b=>b.project===l.project&&b.status==='authorised'); if(esc){esc.holder='Transferred to '+l.partner.split(',')[0]; esc.tx=tx(); esc.ts=now();} log(`<b>First transfer</b> ${fmt(l.qty)} ITMOs under ${l.id}, corresponding adjustment applied`); }
  save(); render(); toast(`${l.id} moved to step ${l.step}.`);
}
function newLoa(){
  const n=S.loas.filter(l=>l.id.startsWith('LoA-2026')).length+1;
  S.loas.unshift({id:`LoA-2026-0${n}`,partner:'[Counterpart], NDC use',use:'Article 6.2 cooperative approach · vintage 2026',project:'p2',qty:1000,step:1,ca:0});
  log(`<b>LoA drafted</b> · LoA-2026-0${n}, 1,000 t`); save(); render(); toast('Draft authorisation created.');
}
function submitField(pid, health, note, disturbance){
  const p=project(pid); p.health=health;
  S.evidence.unshift({project:pid,title:`Council monitoring log, ${p.atoll}`,meta:`Mobile app · health index ${health.toFixed(2)} · ${note||'no note'}`});
  if(disturbance||health<0.7){ S.alerts.unshift({kind:'warn',title:`Field alert, ${p.atoll}`,text:`${disturbance?'Disturbance reported. ':''}Health index ${health.toFixed(2)}. MRV engine has flagged the block for review before next issuance.`}); }
  else { S.alerts.unshift({kind:'good',title:`Field log accepted, ${p.atoll}`,text:`Health index ${health.toFixed(2)} matches satellite classification. Evidence pack updated.`}); }
  S.alerts=S.alerts.slice(0,4);
  log(`<b>Evidence</b> logged · ${p.code} field survey, health ${health.toFixed(2)}`); save(); render(); toast('Survey submitted to the registry.');
}

/* ---------- charts ---------- */
function drawBars(id, series, colors, labels){
  const c=document.getElementById(id); if(!c) return; const dpr=window.devicePixelRatio||1; const W=c.clientWidth, H=c.clientHeight; c.width=W*dpr; c.height=H*dpr; const g=c.getContext('2d'); g.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement); const lineC=cs.getPropertyValue('--line').trim(), txt=cs.getPropertyValue('--muted').trim();
  const max=Math.max(...series.flat())*1.1; const padL=40,padB=22,padT=8; const n=series[0].length; const gw=(W-padL-8)/n;
  g.strokeStyle=lineC; g.fillStyle=txt; g.font='11px IBM Plex Sans, sans-serif'; g.textAlign='right';
  for(let i=0;i<=3;i++){ const y=padT+(H-padB-padT)*(1-i/3); g.beginPath(); g.moveTo(padL,y); g.lineTo(W-8,y); g.stroke(); g.fillText(fmt(Math.round(max*i/3/100)*100),padL-6,y+4); }
  const bw=gw/(series.length+1);
  series.forEach((s,si)=>{ s.forEach((v,i)=>{ const h=(H-padB-padT)*v/max; const x=padL+i*gw+bw*0.5+si*bw; const y=H-padB-h; g.fillStyle=cs.getPropertyValue(colors[si]).trim(); g.beginPath(); g.roundRect(x,y,bw-3,h,[3,3,0,0]); g.fill(); }); });
  g.fillStyle=txt; g.textAlign='center'; labels.forEach((l,i)=>g.fillText(l,padL+i*gw+gw/2,H-6));
}

  $('#resetBtn').onclick=()=>confirmBox('Reset demo data','All sample transactions, certificates and surveys made in this browser will be cleared.','Reset',()=>{S=seed(); save(); render(); toast('Demo data reset.');});

  document.querySelectorAll('[data-batch]').forEach(tr=>tr.onclick=()=>{S.selBatch=tr.dataset.batch; render();});
  ['q','fp','fs'].forEach(id=>{ const el=$('#'+id); if(el) el[id==='q'?'oninput':'onchange']=()=>{S.ledgerFilter={q:$('#q').value,project:$('#fp').value,status:$('#fs').value}; render(); if(id==='q'){const q=$('#q'); q.focus(); q.setSelectionRange(q.value.length,q.value.length);} }; });
  const rb=$('#retireBtn'); if(rb) rb.onclick=()=>{ const b=S.batches.find(x=>x.id===S.selBatch)||S.batches[0]; confirmBox('Retire credits',`Burn <b>${fmt(b.qty)} tokens</b> (${b.serial}) permanently and issue a public retirement certificate. This cannot be undone.`,'Retire',()=>retireBatch(b.id)); };
  const cb=$('#certBtn'); if(cb) cb.onclick=()=>{ const b=S.batches.find(x=>x.id===S.selBatch); S.cert=b.cert; set('certs'); };
  document.querySelectorAll('[data-listing]').forEach(b=>b.onclick=()=>{S.market.listing=b.dataset.listing; S.market.qty=Math.min(S.market.qty,Math.floor(available(b.dataset.listing))||1); save(); render();});
  const inc=$('#inc'), dec=$('#dec'); const avail=()=>Math.floor(available(S.market.listing));
  if(inc) inc.onclick=()=>{S.market.qty=Math.min(avail(),S.market.qty+10); render();};
  if(dec) dec.onclick=()=>{S.market.qty=Math.max(1,S.market.qty-10); render();};
  document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{S.market.qty=Math.max(1,Math.min(avail(),+b.dataset.q)); render();});
  const rt=$('#retireTog'); if(rt) rt.onclick=()=>{S.market.retire=!S.market.retire; render();};
  const bb=$('#buyBtn'); if(bb) bb.onclick=()=>{ const p=project(S.market.listing); const q=Math.min(S.market.qty,avail()); confirmBox('Confirm purchase',`Pay <b>USD ${fmt(q*p.price*1.02)}</b> for ${fmt(q)} tCO2e from ${p.code}${S.market.retire?', retired immediately with a certificate':''}. Benefit shares are paid out by smart contract on settlement.`,'Pay and settle',buy); };
  document.querySelectorAll('[data-adv]').forEach(b=>b.onclick=()=>advanceLoa(b.dataset.adv));
  const nl=$('#newLoa'); if(nl) nl.onclick=newLoa;
  const btr=$('#btrBtn'); if(btr) btr.onclick=()=>toast('BTR annex generated from ledger state at block '+fmt(S.block)+'. Available in Submissions.');
  const cs=$('#certSel'); if(cs) cs.onchange=()=>{S.cert=cs.value; render();};
  const vb=$('#vBtn'); if(vb) vb.onclick=()=>{S.verify=$('#vq').value; render();};
  const vq=$('#vq'); if(vq) vq.onkeydown=(e)=>{ if(e.key==='Enter'){S.verify=vq.value; render();} };
  const cc=$('#copyCert'); if(cc) cc.onclick=()=>{ const c=S.certs.find(x=>x.id===S.cert)||S.certs[S.certs.length-1]; const link='registry.mv/verify/'+c.id; navigator.clipboard.writeText(link).then(()=>toast('Copied '+link)).catch(()=>toast('Verification link: '+link)); };
  const fpj=$('#fpj'); if(fpj) fpj.onchange=()=>{S.fieldProject=fpj.value; S.fieldHealth=undefined; render();};
  const fh=$('#fh'); if(fh) fh.oninput=()=>{S.fieldHealth=+fh.value; $('#fhv').textContent=(+fh.value).toFixed(2);};
  const fn=$('#fn'); if(fn) fn.oninput=()=>{S.fieldNote=fn.value;};
  const fd=$('#fdist'); if(fd) fd.onclick=()=>{S.fieldDist=!S.fieldDist; render();};
  const pb=$('#photoBtn'); if(pb) pb.onclick=()=>{S.fieldPhotos=(S.fieldPhotos||0)+12; $('#photoCt').textContent=S.fieldPhotos+' attached'; toast('12 frames attached, GPS locked.');};
  const fs2=$('#fieldSubmit'); if(fs2) fs2.onclick=()=>{ const pid=S.fieldProject||'p3'; submitField(pid, S.fieldHealth??project(pid).health, S.fieldNote, S.fieldDist); S.fieldDist=false; S.fieldNote=''; S.fieldPhotos=0; S.fieldHealth=undefined; save(); render(); };
}
window.addEventListener('hashchange',()=>{ const v=location.hash.slice(1); if(NAV.some(n=>n[0]===v)&&v!==S.view){S.view=v; render();} });
window.addEventListener('resize',()=>{ if(S.view==='overview'||S.view==='projects') render(); });
(function start(){ const v=location.hash.slice(1); if(NAV.some(n=>n[0]===v)) S.view=v; render(); })();
</script>

</body>
</html>
